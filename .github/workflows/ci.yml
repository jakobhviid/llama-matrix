# Checks that are not the release gate.
#
# release.yml already runs clippy + test on every push to `main`, and `main` is where
# this repository is developed: there are no pull requests to gate. So this workflow
# covers the two cases that leaves uncovered, and deliberately nothing else.
#
#   - `gate` runs the identical clippy + test on a push to any OTHER branch, so
#     branch work is checked without waiting to be merged. It is skipped on `main`
#     rather than duplicating a job that is already deciding the release.
#   - `deny` answers the supply-chain question everywhere. It lives here, not in
#     release.yml, precisely so it can never block a release: a licence or source
#     finding is something to look at, not a reason to stop shipping a fix.
name: ci

on:
  push:
  workflow_dispatch:

# A newer push makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The same two commands release.yml gates on. Keep them identical: a check that
      # differs from the one deciding the release can pass and still block it.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Licences and sources only; deny.toml explains why advisories are not here.
          command: check licenses sources
