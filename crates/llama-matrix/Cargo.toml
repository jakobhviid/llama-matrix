[package]
name = "llama-matrix"
description = "Measure llama-swap model memory footprints and generate a co-residency matrix so as many models run concurrently as physically fit — without exceeding VRAM."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[[bin]]
name = "llama-matrix"
path = "src/main.rs"

[dependencies]
llama-matrix-core = { path = "../llama-matrix-core" }
anyhow = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
