[package]
name = "llama-matrix-core"
description = "The library behind llama-matrix: llama-swap config parsing, footprint measurement, the co-residency knapsack, and matrix generation."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
