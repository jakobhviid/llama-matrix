[package]
name = "llama-matrix-core"
description = "The library behind llama-matrix: llama-swap config parsing, footprint measurement, the co-residency knapsack, and matrix generation."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"                 # kill(pid, 0) liveness check for the measure sweep lock
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sha1 = "0.10"
# http-only (llama-swap is local): no TLS, so no ring/rustls — keeps the release
# cross-build (musl/darwin) clean and the binary small.
ureq = { version = "2", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
